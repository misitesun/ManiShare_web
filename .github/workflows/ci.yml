name: CI

on:
    push:
        branches: ["**"]
    pull_request:
    merge_group:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: Test, lint and build
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Check out source
              uses: actions/checkout@v4

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.28.2

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm run lint

            - name: Test
              run: pnpm run test

            - name: Generate Next types in a clean checkout
              run: pnpm run typecheck

            - name: Build production bundle
              run: pnpm run build

            - name: Build staging bundle
              run: pnpm run build:staging

            - name: Production Web and Electron runtime smoke
              run: xvfb-run -a pnpm run runtime:smoke

            - name: Production animation and sound-wave runtime smoke
              run: xvfb-run -a pnpm run settings-effects:smoke
